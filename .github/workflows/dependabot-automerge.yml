name: Dependabot guarded auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'Jeremy-Cleland/incident-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out PR code with this write token.
      - name: Verify Dependabot metadata and signed commits
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge after required checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          script: |
            const expectedChecks = ["verify"];
            const allowedFiles = new Set(["pyproject.toml", "uv.lock", "web/package-lock.json", "web/package.json"]);
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const snapshot = context.payload.pull_request.head.sha;
            const dependencies = JSON.parse(process.env.DEPENDENCIES || '[]');
            // fetch-metadata verifies the author and signatures of every commit. A group is
            // eligible only when every dependency has a known, non-major update type.
            if (!Array.isArray(dependencies) || !dependencies.length || dependencies.some(dep =>
              !['version-update:semver-patch', 'version-update:semver-minor'].includes(dep.updateType) ||
              dep.maintainerChanges !== false ||
              !['npm_and_yarn', 'npm', 'pip', 'uv'].includes(dep.packageEcosystem) ||
              [dep.prevVersion, dep.newVersion].some(v => v && !/^v?\d+(?:\.\d+){0,3}$/.test(v)) ||
              (dep.updateType === 'version-update:semver-minor' && /^v?0\./.test(dep.prevVersion || ''))
            )) {
              core.info('Manual review: major, pre-release, pre-1.0 minor, unsupported, or unknown update.');
              return;
            }
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number});
            if (pr.state !== 'open' || pr.draft || pr.user.login !== 'dependabot[bot]' ||
                pr.head.repo?.full_name !== context.payload.repository.full_name ||
                pr.base.ref !== context.payload.repository.default_branch || pr.head.sha !== snapshot) return;
            const files = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number, per_page: 100});
            if (!files.length || files.some(file => file.status !== 'modified' || !allowedFiles.has(file.filename))) {
              core.info('Manual review: changes extend beyond the approved dependency manifests and lockfiles.');
              return;
            }
            // Server-side protection must remain present. This job never approves or merges
            // directly, and it never checks out or executes pull-request code.
            const {data: rules} = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
              owner, repo, branch: pr.base.ref
            });
            const checkRules = rules.filter(rule => rule.type === 'required_status_checks');
            const checks = checkRules.flatMap(rule => rule.parameters.required_status_checks);
            if (!expectedChecks.length || !expectedChecks.every(name => checks.some(check =>
                  check.context === name && check.integration_id === 15368)) ||
                !checkRules.some(rule => rule.parameters.strict_required_status_checks_policy === true) ||
                !rules.some(rule => rule.type === 'pull_request')) {
              core.setFailed('Required GitHub Actions checks or pull-request protection are missing.');
              return;
            }
            const {data: latest} = await github.rest.pulls.get({owner, repo, pull_number});
            if (latest.head.sha !== snapshot || latest.state !== 'open') return;
            if (latest.auto_merge) {
              core.info('Auto-merge is already enabled.');
              return;
            }
            await github.graphql(`mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                pullRequest { number }
              }
            }`, {id: pr.node_id});
            core.info('Auto-merge enabled; GitHub will wait for the required checks and branch rules.');
